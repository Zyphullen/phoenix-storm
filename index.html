<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05060c">
<meta name="description" content="Phoenix Storm v0.3 — a browser space shooter by Zyphullen.">
<title>Phoenix Storm</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%2305060c' width='32' height='32'/%3E%3Cpath fill='%23ff7a2f' d='M16 4c2 6 8 8 8 14a8 8 0 1 1-16 0c0-6 6-8 8-14z'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #05060c;
  --cyan: #7ef6ff;
  --orange: #ff8a3d;
  --gold: #ffc56e;
  --text: #f4f0e8;
  --muted: #a9b4c4;
  --line: rgba(126, 246, 255, 0.32);
  --danger: #ff4d6a;
  color-scheme: dark;
  font-family: "Segoe UI", "Liberation Sans", "Nimbus Sans", "Helvetica Neue", Arial, sans-serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}

button, input { font: inherit; color: inherit; }

button {
  cursor: pointer;
  touch-action: manipulation;
}

button:focus-visible {
  outline: 2px solid var(--cyan);
  outline-offset: 2px;
}

button:disabled {
  opacity: 0.35;
  cursor: default;
}

#app {
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: stretch;
  background: var(--bg);
}

#frame {
  position: relative;
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  min-height: 0;
  background: #07060d;
  overflow: hidden;
}

body[data-layout="desktop"] #app {
  align-items: center;
  background:
    radial-gradient(ellipse at 50% -10%, rgba(120, 48, 16, 0.45), transparent 52%),
    #030308;
}

body[data-layout="desktop"] #frame {
  width: min(1120px, calc(100% - 36px));
  height: min(760px, calc(100% - 32px));
  border-radius: 18px;
  border: 1px solid rgba(126, 246, 255, 0.34);
  box-shadow:
    0 0 0 1px rgba(255, 122, 40, 0.14),
    0 30px 90px rgba(0, 0, 0, 0.55),
    inset 0 0 80px rgba(255, 90, 20, 0.05);
}

.corner { display: none; }

body[data-layout="desktop"] .corner {
  display: block;
  position: absolute;
  width: 22px;
  height: 22px;
  z-index: 9;
  pointer-events: none;
  border: 2px solid rgba(255, 168, 92, 0.9);
}

.corner.tl { top: 8px; left: 8px; border-right: 0; border-bottom: 0; }
.corner.tr { top: 8px; right: 8px; border-left: 0; border-bottom: 0; }
.corner.bl { bottom: 8px; left: 8px; border-right: 0; border-top: 0; }
.corner.br { bottom: 8px; right: 8px; border-left: 0; border-top: 0; }

#hud {
  background: linear-gradient(180deg, rgba(5, 8, 16, 0.88), rgba(5, 8, 16, 0.28));
  border-bottom: 1px solid rgba(126, 246, 255, 0.22);
  box-shadow: inset 0 -1px 0 rgba(255, 140, 60, 0.18);
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  grid-template-areas: "left right" "mid mid";
  gap: 2px 8px;
  align-items: center;
  padding: calc(6px + env(safe-area-inset-top)) 10px 4px;
  background: linear-gradient(180deg, rgba(5, 6, 12, 0.92), rgba(5, 6, 12, 0.55));
}

body[data-layout="desktop"] #hud {
  grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
  grid-template-areas: "left mid right";
  min-height: 62px;
  padding: 16px 48px 8px;
}

.hud-left { grid-area: left; min-width: 0; }
.hud-mid { grid-area: mid; display: flex; justify-content: center; align-items: center; min-height: 18px; }
.hud-right {
  grid-area: right;
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 6px;
}

#place {
  font-size: 12px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--gold);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

#stage-label {
  font-size: 12px;
  color: var(--muted);
  letter-spacing: 0.04em;
}

#pips { display: none; }

#pips i {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  display: block;
  border: 1px solid rgba(255, 255, 255, 0.38);
  box-sizing: border-box;
}

#pips i.done {
  background: #ff7a2f;
  border-color: #ffc56e;
  box-shadow: 0 0 6px rgba(255, 122, 47, 0.85);
}

#pips i.now {
  background: var(--cyan);
  border-color: #fff;
  box-shadow: 0 0 8px rgba(126, 246, 255, 0.95);
}

#bossbox { min-width: min(280px, 70vw); }

#bossname {
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  text-align: center;
  color: #ffb089;
}

.boss-track {
  height: 8px;
  border-radius: 99px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 120, 60, 0.45);
  overflow: hidden;
}

#bossfill {
  height: 100%;
  width: 100%;
  background: linear-gradient(90deg, #ff3b1a, #ffb15a);
  box-shadow: 0 0 10px rgba(255, 80, 20, 0.8);
}

#lvline { text-align: right; line-height: 1.15; min-width: 62px; }
#lv { display: block; font-size: 14px; color: #fff; letter-spacing: 0.06em; }
#dmgstat { display: block; font-size: 10px; letter-spacing: 0.08em; color: var(--gold); }

.icon-btn, .chip {
  position: relative;
  border: 1px solid var(--line);
  background: rgba(8, 12, 18, 0.72);
  color: var(--cyan);
  border-radius: 10px;
  min-width: 36px;
  height: 36px;
  display: grid;
  place-items: center;
  padding: 0;
}

.icon-btn svg { width: 18px; height: 18px; display: block; }
.icon-btn.off { opacity: 0.45; }
.icon-btn.off::after {
  content: "";
  position: absolute;
  width: 2px;
  height: 70%;
  background: #ff7a8c;
  transform: rotate(42deg);
  border-radius: 2px;
}

.chip {
  padding: 0 8px;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.12em;
  color: var(--muted);
}

.chip.on, #btn-auto-dock.on {
  color: #041016;
  background: linear-gradient(180deg, #d9fdff, #3ad4ea);
  border-color: #bff8ff;
  box-shadow: 0 0 14px rgba(80, 220, 255, 0.45);
}

body[data-layout="phone"] #btn-auto { display: none; }

#xpbar {
  height: 4px;
  background: rgba(255, 255, 255, 0.06);
}

#xpfill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #ff6a1a, #ffe1a8);
  box-shadow: 0 0 8px rgba(255, 160, 60, 0.8);
}

#skills {
  display: flex;
  justify-content: center;
  gap: 8px;
  padding: 4px 8px 0;
  pointer-events: none;
  min-height: 0;
}

#skills:empty { display: none; }

.skill { width: 58px; text-align: center; --p: 0%; }

.gem {
  position: relative;
  width: 36px;
  height: 36px;
  margin: 0 auto;
  border-radius: 10px;
  border: 1px solid rgba(255, 160, 80, 0.75);
  background: rgba(12, 8, 14, 0.8);
  box-shadow: inset 0 0 10px rgba(255, 110, 30, 0.28);
  overflow: hidden;
  display: grid;
  place-items: center;
}

.skill[data-id="lance"] .gem {
  border-color: rgba(126, 246, 255, 0.85);
  box-shadow: inset 0 0 10px rgba(80, 220, 255, 0.28);
}

.gem svg { width: 22px; height: 22px; }
.gem .cd {
  position: absolute;
  inset: 0;
  background: conic-gradient(rgba(0, 0, 0, 0.68) var(--p), transparent 0);
}

.skill span {
  display: block;
  margin-top: 2px;
  font-size: 9px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: #d5dde8;
}

#stage {
  position: relative;
  flex: 1;
  min-height: 0;
}

#view {
  width: 100%;
  height: 100%;
  display: block;
  background: #05060c;
  touch-action: none;
}

#toast {
  position: absolute;
  left: 50%;
  top: 6%;
  transform: translateX(-50%);
  text-align: center;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.2s linear;
  width: min(520px, 92%);
  z-index: 3;
}

#toast.show { opacity: 1; }

#toast .big {
  font-weight: 900;
  letter-spacing: 0.14em;
  font-size: clamp(26px, 6vw, 52px);
  color: #ffb15a;
  text-shadow: 0 0 18px rgba(255, 120, 30, 0.85), 0 2px 0 #3a1200;
  line-height: 1;
}

#toast .sub, #toast .lv {
  margin-top: 4px;
  color: #f4f0e8;
  letter-spacing: 0.06em;
  font-size: 14px;
  text-shadow: 0 1px 2px #000;
}

#toast .stats {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-top: 6px;
  color: #ffe0b0;
  font-weight: 800;
  letter-spacing: 0.06em;
  font-size: 13px;
}

#toast .unlock {
  margin-top: 4px;
  color: var(--cyan);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  font-size: 13px;
  text-shadow: 0 0 10px rgba(80, 220, 255, 0.6);
}

#hpbar {
  position: absolute;
  left: 10px;
  right: 10px;
  bottom: 6px;
  height: 14px;
  border-radius: 8px;
  background: rgba(0, 0, 0, 0.5);
  border: 1px solid rgba(255, 255, 255, 0.14);
  overflow: hidden;
  z-index: 2;
}

#hpfill {
  height: 100%;
  width: 100%;
  background: linear-gradient(90deg, #ff4d1a, #ffb15a);
  box-shadow: 0 0 16px rgba(255, 120, 40, 0.8);
}

#hpbar.low #hpfill {
  background: linear-gradient(90deg, #ff2458, #ff7a4a);
}

#hptext {
  position: absolute;
  inset: 0;
  text-align: right;
  padding-right: 6px;
  font-size: 10px;
  line-height: 13px;
  letter-spacing: 0.04em;
  color: white;
  text-shadow: 0 1px 2px #000;
}

#keyhint {
  display: none;
  position: absolute;
  left: 0;
  right: 0;
  bottom: 26px;
  text-align: center;
  margin: 0;
  font-size: 11px;
  letter-spacing: 0.16em;
  color: rgba(210, 230, 240, 0.45);
  pointer-events: none;
  z-index: 2;
}

body[data-layout="desktop"][data-playing="1"] #keyhint { display: none; }

#dock {
  display: none;
  gap: 10px;
  padding: 8px 10px calc(10px + env(safe-area-inset-bottom));
  background: rgba(5, 6, 12, 0.92);
}

body[data-layout="phone"][data-playing="1"] #dock { display: flex; }

#dock button {
  flex: 1;
  min-height: 72px;
  font-size: 44px;
  line-height: 1;
  border-radius: 16px;
  border: 1px solid rgba(126, 246, 255, 0.35);
  background: rgba(8, 14, 22, 0.92);
  color: #e7fbff;
}

#btn-auto-dock {
  flex: 0.72;
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 0.14em;
}

#dock button:active { transform: translateY(1px); }

body[data-layout="phone"][data-orient="landscape"][data-playing="1"] #dock {
  position: absolute;
  inset: 0;
  display: block;
  pointer-events: none;
  background: none;
  z-index: 6;
  padding: 0;
}

body[data-layout="phone"][data-orient="landscape"][data-playing="1"] #dock button {
  pointer-events: auto;
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 64px;
  min-height: 86px;
  flex: none;
  background: rgba(8, 14, 22, 0.72);
}

body[data-layout="phone"][data-orient="landscape"] #btn-left { left: 8px; }
body[data-layout="phone"][data-orient="landscape"] #btn-right { right: 8px; }

body[data-layout="phone"][data-orient="landscape"] #btn-auto-dock {
  top: auto;
  bottom: calc(8px + env(safe-area-inset-bottom));
  left: 50%;
  width: 96px;
  min-height: 36px;
  transform: translateX(-50%);
  font-size: 12px;
}

body[data-mode="pause"] #dock,
body[data-mode="rebirth"] #dock { display: none !important; }

body[data-playing="0"] #hud,
body[data-playing="0"] #xpbar,
body[data-playing="0"] #skills,
body[data-playing="0"] #hpbar,
body[data-playing="0"] #dock,
body[data-playing="0"] #keyhint { display: none !important; }

#screen {
  display: none;
  position: absolute;
  inset: 0;
  z-index: 8;
  align-items: flex-start;
  justify-content: center;
  padding: 18px 14px 36px;
  overflow: auto;
  background: rgba(0, 0, 0, 0.52);
}

body[data-mode="title"] #screen,
body[data-mode="help"] #screen,
body[data-mode="plan"] #screen,
body[data-mode="confirm"] #screen,
body[data-mode="pause"] #screen,
body[data-mode="rebirth"] #screen,
body[data-mode="victory"] #screen,
body[data-mode="level"] #screen,
body[data-mode="stats"] #screen,
body[data-mode="settings"] #screen,
body[data-mode="dead"] #screen { display: flex; }

body[data-mode="title"] #screen {
  background: linear-gradient(180deg, rgba(0, 0, 0, 0.62) 0%, rgba(0, 0, 0, 0.22) 46%, rgba(0, 0, 0, 0.02) 72%);
}

body[data-mode="pause"] #screen,
body[data-mode="victory"] #screen,
body[data-mode="rebirth"] #screen,
body[data-mode="level"] #screen,
body[data-mode="stats"] #screen,
body[data-mode="settings"] #screen,
body[data-mode="dead"] #screen { align-items: center; }

.cards {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
  margin: 10px 0 8px;
}

.upcard {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  min-height: 168px;
  padding: 10px 8px;
  border-radius: 14px;
  border: 1px solid rgba(255, 140, 60, 0.45);
  background: rgba(18, 10, 6, 0.72);
  color: #fff8ef;
  text-align: center;
}

.upcard.cyan { border-color: rgba(90, 220, 255, 0.5); background: rgba(6, 16, 22, 0.72); }

.upcard .ico svg { width: 42px; height: 42px; filter: drop-shadow(0 0 8px rgba(255, 140, 60, 0.7)); }
.upcard.cyan .ico svg { filter: drop-shadow(0 0 8px rgba(80, 220, 255, 0.7)); }
.upcard b { font-size: 13px; }
.upcard small { color: #ffb15a; letter-spacing: 0.08em; font-size: 10px; }
.upcard.cyan small { color: #9aefff; }
.upcard span { color: #d7cbbd; font-size: 11px; line-height: 1.3; }

.shop { display: flex; flex-direction: column; gap: 6px; max-height: 46vh; overflow: auto; margin: 8px 0; }
.shoprow { display: grid; grid-template-columns: 36px minmax(0, 1fr) 72px; gap: 8px; align-items: center; text-align: left; }
.shoprow .ico svg { width: 32px; height: 32px; }
.shoprow b { display: block; font-size: 13px; }
.shoprow small { color: #cbbdae; font-size: 11px; }
.shoprow button { min-height: 36px; padding: 6px; }

.picks { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 10px; }
.chip { border-radius: 999px; border: 1px solid rgba(255,255,255,0.16); background: rgba(8,10,16,0.6); color: #fff; padding: 6px 10px; font-size: 12px; }
.chip.on { border-color: #ff9a4a; color: #ffd7b0; }

#joy { position: absolute; left: 18px; bottom: 28px; width: 120px; height: 120px; z-index: 4; }
#joy-base { width: 120px; height: 120px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.28); position: relative; }
#joy-knob { width: 48px; height: 48px; border-radius: 50%; background: rgba(255,150,70,0.85); position: absolute; left: 36px; top: 36px; }

@media (max-width: 720px) {
  .cards { grid-template-columns: 1fr; }
  .upcard { min-height: 0; flex-direction: row; text-align: left; }
}

.card.wide { width: min(680px, 100%); }
.card svg { width: 32px; height: 32px; display: block; }
.statgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; text-align: left; margin: 10px 0 12px; }
.statgrid div { background: rgba(255,255,255,0.04); border-radius: 8px; padding: 6px 8px; }
.statgrid span { display: block; color: #b7aea4; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }
.carry { list-style: none; padding: 0; margin: 6px 0 12px; text-align: left; }
.carry li { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
.setrow {
  display: flex;
  width: 100%;
  justify-content: space-between;
  align-items: center;
  margin: 6px 0;
  min-height: 42px;
  padding: 0 12px;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.14);
  background: rgba(8, 12, 18, 0.75);
  color: #fff;
}
.card {
  width: min(440px, 100%);
  margin-top: min(6vh, 48px);
  background: rgba(6, 8, 16, 0.78);
  border: 1px solid rgba(126, 246, 255, 0.42);
  border-radius: 16px;
  backdrop-filter: blur(10px);
  padding: 22px 18px 16px;
  box-shadow: 0 22px 60px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 150, 70, 0.16), inset 0 0 48px rgba(255, 110, 30, 0.07);
  text-align: center;
}

body[data-mode="pause"] .card,
body[data-mode="victory"] .card,
body[data-mode="rebirth"] .card { margin-top: 0; }

.logo {
  display: flex;
  flex-wrap: nowrap;
  justify-content: center;
  align-items: center;
  gap: 0.22em;
  margin: 0;
}

.logo .word {
  font-family: Impact, "Arial Black", "Liberation Sans", "Segoe UI", sans-serif;
  font-weight: 800;
  font-size: clamp(20px, 4.6vw, 40px);
  letter-spacing: 0.08em;
  line-height: 1;
  white-space: nowrap;
  color: #ffb15a;
  text-shadow: 0 0 18px rgba(255, 120, 40, 0.45);
}

@supports ((-webkit-background-clip: text) or (background-clip: text)) {
  .logo .word {
    background: linear-gradient(180deg, #fff7ec 8%, #ffd7a8 42%, #ff7a2f 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
}

.logo .flame { width: 34px; height: 26px; display: block; flex: none; }
.logo .flame svg { width: 34px; height: 26px; display: block; }

.by, .where, .next, .note {
  color: var(--muted);
  font-size: 13px;
  letter-spacing: 0.06em;
  margin: 8px 0 14px;
}

.where { color: #d5dde8; margin-top: 2px; }

h2 {
  margin: 0;
  font-size: 22px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.kicker {
  margin: 0;
  letter-spacing: 0.18em;
  color: var(--gold);
  font-size: 12px;
}

.bonus {
  margin: 8px 0;
  color: var(--cyan);
  font-weight: 800;
  letter-spacing: 0.08em;
}

.btn-primary, .btn-ghost, .btn-text {
  display: block;
  width: 100%;
  border-radius: 12px;
  min-height: 48px;
  margin: 8px 0;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  font-weight: 800;
}

.btn-primary {
  border: none;
  color: #2a0d04;
  background: linear-gradient(180deg, #ffb067, #ef5d0d);
  box-shadow: 0 0 22px rgba(255, 120, 40, 0.35);
}

.btn-primary:active { transform: translateY(1px); }

.btn-ghost {
  background: transparent;
  border: 1px solid rgba(126, 246, 255, 0.4);
  color: var(--cyan);
}

.btn-text {
  background: none;
  border: none;
  color: var(--muted);
  min-height: 36px;
  letter-spacing: 0.08em;
}

.sound-row {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-top: 6px;
}

.field { margin: 10px 0; }
.field-label {
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
  text-align: left;
  margin-bottom: 4px;
}

.stepper {
  display: grid;
  grid-template-columns: 40px minmax(0, 1fr) 40px;
  gap: 6px;
  align-items: center;
}

.stepper b {
  font-weight: 700;
  font-size: 15px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.step {
  height: 40px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: rgba(8, 12, 18, 0.8);
  color: white;
  font-size: 26px;
  line-height: 1;
}

.tips { text-align: left; margin: 8px 0 12px; }

.tip {
  display: grid;
  grid-template-columns: 22px minmax(0, 1fr);
  gap: 8px;
  margin: 8px 0;
}

.tip b { color: var(--cyan); }
.tip strong { display: block; font-size: 13px; letter-spacing: 0.04em; }
.tip span { display: block; color: var(--muted); font-size: 12px; line-height: 1.35; }

#ver {
  display: none;
  position: absolute;
  right: 12px;
  bottom: 8px;
