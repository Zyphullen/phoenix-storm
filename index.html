  function showToast(title, sub, ms) {
    var el = $('toast');
    el.innerHTML = '<div class="big">' + esc(title) + '</div>' + (sub ? '<div class="sub">' + esc(sub) + '</div>' : '');
    el.classList.add('show');
    toastUntil = time + (ms || 1200) / 1000;
  }
  function hideToast() { $('toast').classList.remove('show'); toastUntil = 0; }
  function tickToast() { if (toastUntil && time > toastUntil) hideToast(); }

  function icon(id) {
    if (ICONS[id]) return ICONS[id];
    var hue = 0;
    var i;
    for (i = 0; i < id.length; i++) hue = (hue + id.charCodeAt(i) * (i + 3)) % 360;
    var fire = hue % 2 === 0;
    var c1 = fire ? '#fff6d8' : '#e9fbff';
    var c2 = fire ? '#ff7a2f' : '#3ad4ea';
    var n = id.length % 4;
    var shape = n === 0
      ? '<circle cx="24" cy="24" r="8" fill="' + c1 + '"/><circle cx="24" cy="24" r="14" fill="none" stroke="' + c2 + '" stroke-width="3"/>'
      : n === 1
        ? '<path fill="' + c2 + '" d="M24 6l5 14h14l-11 8 4 14-12-8-12 8 4-14L5 20h14z"/>'
        : n === 2
          ? '<path fill="' + c2 + '" d="M10 34 L24 8 L38 34 Z"/><circle cx="24" cy="26" r="4" fill="' + c1 + '"/>'
          : '<path fill="none" stroke="' + c2 + '" stroke-width="3" d="M8 24h32M24 8v32"/><circle cx="24" cy="24" r="7" fill="' + c1 + '"/>';
    return '<svg viewBox="0 0 48 48">' + shape + '</svg>';
  }

  function titleHtml() {
    var primary = fresh
      ? '<button type="button" class="btn-primary" data-act="begin">Begin Storm</button>'
      : '<button type="button" class="btn-primary" data-act="continue">Continue</button>';
    var best = meta.best[String(frontier.area)] || 0;
    var where = '<p class="where">Lifeforce ' + meta.lifeforce + '<br>' + esc(Sim.systemName(frontier.system)) +
      ' · Area ' + frontier.area + ' · Level ' + frontier.level + '<br>Best ' + fmtTime(best) + '</p>';
    var extra = '<button type="button" class="btn-ghost" data-act="altar">Phoenix Altar</button>';
    if (!fresh) extra += '<button type="button" class="btn-ghost" data-act="plan">Flight Plan</button>';
    extra += '<button type="button" class="btn-ghost" data-act="help">How to Fly</button>';
    extra += '<button type="button" class="btn-ghost" data-act="settings">Settings</button>';
    if (!fresh) extra += '<button type="button" class="btn-text" data-act="confirm">New Storm</button>';
    return '<div class="card"><div class="logo"><span class="word">PHOENIX</span><span class="flame">' + ICONS.ember +
      '</span><span class="word">STORM</span></div><p class="by">by Zyphullen</p>' + where + primary + extra + '</div>';
  }

  function helpHtml() {
    var tips = [
      ['Fly freely', 'The ship glides toward the pointer. Turn that off to use WASD or the joystick.'],
      ['Weapons fire alone', 'They aim themselves. Higher levels aim faster and hit harder.'],
      ['XP gems', 'Kills drop cyan gems. They fill the level bar for this run only.'],
      ['Three cards', 'Each level offers one skill, one item, and one stat, in a random order.'],
      ['Lifeforce', 'Orange drops are money. They stay after you fall and buy altar ranks.'],
      ['Survive', 'A timer runs the whole flight. A boss arrives every two minutes.'],
      ['Stats', 'The Stats button or Tab lists what you carry. It pauses unless Auto Pause is off.']
    ];
    var html = '<div class="card"><h2>How to Fly</h2><div class="tips">';
    var i;
    for (i = 0; i < tips.length; i++) {
      html += '<div class="tip"><b>' + (i + 1) + '</b><div><strong>' + esc(tips[i][0]) + '</strong><span>' + esc(tips[i][1]) + '</span></div></div>';
    }
    html += '</div><button type="button" class="btn-primary" data-act="back">Back</button></div>';
    return html;
  }

  function settingsHtml() {
    function row(act, label, on) {
      return '<button type="button" class="setrow" data-act="' + act + '" aria-pressed="' + (on ? 'true' : 'false') + '"><span>' +
        label + '</span><b>' + (on ? 'On' : 'Off') + '</b></button>';
    }
    return '<div class="card"><h2>Settings</h2>' +
      row('music', 'Music', settings.music) +
      row('sfx', 'Sound effects', settings.sfx) +
      row('follow', 'Auto Follow Mouse', settings.follow) +
      row('autopause', 'Auto Pause', settings.autoPause) +
      '<button type="button" class="btn-primary" data-act="back">Back</button></div>';
  }

  function statsHtml() {
    var html = '<div class="card wide"><p class="kicker">Ship Lv ' + player.level + '</p><h2>Stats</h2><div class="statgrid">';
    var rows = [
      ['Hull', Math.ceil(player.hp) + ' / ' + player.maxHp],
      ['Damage', player.damage.toFixed(2) + '×'],
      ['Fire rate', player.rate.toFixed(2) + '×'],
      ['Area', player.area.toFixed(2) + '×'],
      ['Speed', Math.round(player.speed) + ''],
      ['Magnet', player.magnet.toFixed(2) + '×'],
      ['Regen', player.regen.toFixed(1) + '/s']
    ];
    var i;
    for (i = 0; i < rows.length; i++) html += '<div><span>' + rows[i][0] + '</span><b>' + rows[i][1] + '</b></div>';
    html += '</div><h3>Weapons</h3><ul class="carry">';
    for (i = 0; i < player.weapons.length; i++) {
      var wpn = findDef(WEAPONS, player.weapons[i].id);
      html += '<li>' + icon(player.weapons[i].id) + '<span>' + esc(wpn ? wpn.name : player.weapons[i].id) + '</span><b>Lv ' + player.weapons[i].lv + '</b></li>';
    }
    html += '</ul><h3>Items</h3><ul class="carry">';
    if (!player.items.length) html += '<li><span>None yet</span></li>';
    for (i = 0; i < player.items.length; i++) {
      var it = findDef(ITEMS, player.items[i].id);
      html += '<li>' + icon(player.items[i].id) + '<span>' + esc(it ? it.name : player.items[i].id) + '</span><b>Lv ' + player.items[i].lv + '</b></li>';
    }
    html += '</ul><button type="button" class="btn-primary" data-act="close-panel">Close</button></div>';
    return html;
  }

  function levelHtml() {
    var html = '<div class="card wide"><p class="kicker">Level ' + player.level + '</p><h2>Choose one</h2><div class="cards">';
    var i;
    for (i = 0; i < cards.length; i++) {
      var c = cards[i];
      var def = c.kind === 'weapon' ? findDef(WEAPONS, c.id) : c.kind === 'item' ? findDef(ITEMS, c.id) : findDef(STATS, c.id);
      var name = def ? def.name : 'Boost';
      var line = def ? def.line : '';
      var tag = (c.kind === 'weapon' ? 'SKILL' : c.kind === 'item' ? 'ITEM' : 'STAT') + (c.upgrade ? ' · Lv ' + c.lv : ' · New');
      html += '<button type="button" class="upcard ' + (def && def.hue === 'cyan' ? 'cyan' : 'fire') + '" data-act="pick" data-idx="' + i + '">' +
        '<span class="ico">' + icon(c.id || 'heart') + '</span><b>' + esc(name) + '</b><small>' + tag + '</small><span>' + esc(line) + '</span></button>';
    }
    html += '</div>';
    if (player.rerolls > 0) html += '<button type="button" class="btn-ghost" data-act="reroll">Reroll (' + player.rerolls + ')</button>';
    html += '</div>';
    return html;
  }

  function setScreen(html) {
    $('screen').innerHTML = html || '';
    syncChrome();
  }

  function openPanel(name) {
    panel = name;
    if (name === 'settings') setScreen(settingsHtml());
    else if (name === 'stats') setScreen(statsHtml());
    else if (name === 'level') setScreen(levelHtml());
    else if (name === 'pause') {
      setScreen('<div class="card"><p class="kicker">Paused</p><h2>' + esc(Sim.systemName(run.system)) +
        '</h2><p class="by">Area ' + run.area + ' · Level ' + run.level + ' · ' + fmtTime(survive) +
        '</p><button type="button" class="btn-primary" data-act="resume">Resume</button>' +
        '<button type="button" class="btn-ghost" data-act="settings">Settings</button>' +
        '<button type="button" class="btn-ghost" data-act="leave">Leave</button></div>');
    } else if (name === 'rebirth') {
      setScreen('<div class="card"><div class="logo"><span class="word">REBIRTH</span></div><p class="by">The phoenix rises.</p><button type="button" class="btn-primary" data-act="rise">Rise</button></div>');
    }
    syncChrome();
  }

  function closePanel() {
    panel = null;
    if (mode === 'title' || mode === 'help' || mode === 'plan' || mode === 'confirm') return;
    setScreen('');
    syncChrome();
    if (mode === 'play' && player.xp >= xpNeed()) openLevelUp();
  }

  function showTitle() {
    mode = 'title';
    panel = null;
    enemies = [];
    shots = [];
    orbs = [];
    beams = [];
    rings = [];
    bossRef = null;
    AudioBus.setBoss(false);
    hideToast();
    setScreen(titleHtml());
  }

  function maxArea() { return plan.system < frontier.system ? 10 : frontier.area; }
  function maxLevel() {
    if (plan.system === frontier.system && plan.area === frontier.area) return frontier.level;
    return 3;
  }
  function clampPlan() {
    plan.system = clamp(plan.system, 1, frontier.system);
    plan.area = clamp(plan.area, 1, maxArea());
    plan.level = clamp(plan.level, 1, maxLevel());
  }
  function planHtml() {
    clampPlan();
    function step(act, label, arrow, disabled) {
      return '<button type="button" class="step" data-act="' + act + '" aria-label="' + label + '"' + (disabled ? ' disabled' : '') + '>' + arrow + '</button>';
    }
    return '<div class="card"><h2>Flight Plan</h2><p class="note">Any stage you have reached.</p>' +
      '<div class="field"><div class="field-label">System</div><div class="stepper">' +
      step('sys-prev', 'Previous system', '‹', plan.system <= 1) + '<b>' + esc(Sim.systemName(plan.system)) + '</b>' +
      step('sys-next', 'Next system', '›', plan.system >= frontier.system) + '</div></div>' +
      '<div class="field"><div class="field-label">Area</div><div class="stepper">' +
      step('area-prev', 'Previous area', '‹', plan.area <= 1) + '<b>Area ' + plan.area + '</b>' +
      step('area-next', 'Next area', '›', plan.area >= maxArea()) + '</div></div>' +
      '<div class="field"><div class="field-label">Level</div><div class="stepper">' +
      step('lv-prev', 'Previous level', '‹', plan.level <= 1) + '<b>Level ' + plan.level + '</b>' +
      step('lv-next', 'Next level', '›', plan.level >= maxLevel()) + '</div></div>' +
      '<button type="button" class="btn-primary" data-act="fly">Fly</button>' +
      '<button type="button" class="btn-ghost" data-act="back">Back</button></div>';
  }

  function victoryHtml() {
    var beaten = pending.beaten;
    return '<div class="card"><p class="kicker">Boss down · ' + fmtTime(survive) + '</p><h2>' + esc(Sim.bossName(beaten.system)) +
      ' falls</h2><p class="by">Best in this area ' + fmtTime(meta.best[String(beaten.area)] || survive) +
      '</p><p class="next">The storm keeps going. The next boss is two minutes out.</p>' +
      '<button type="button" class="btn-primary" data-act="keep">Keep flying</button>' +
      '<button type="button" class="btn-ghost" data-act="replay">Restart</button>' +
      '<button type="button" class="btn-ghost" data-act="leave">Leave</button></div>';
  }

  function deadHtml() {
    return '<div class="card"><p class="kicker">The storm takes you</p><h2>Fallen</h2><p class="by">Survived ' +
      fmtTime(survive) + '<br>Best ' + fmtTime(meta.best[String(run.area)] || 0) + '<br>Lifeforce ' + meta.lifeforce +
      '</p><button type="button" class="btn-primary" data-act="replay">Retry</button>' +
      '<button type="button" class="btn-ghost" data-act="altar">Phoenix Altar</button>' +
      '<button type="button" class="btn-ghost" data-act="leave">Title</button></div>';
  }

  function altarCost(def, lv) {
    return Math.round(def.base * Math.pow(1.62, lv));
  }

  function altarHtml() {
    var html = '<div class="card wide"><p class="kicker">Lifeforce ' + meta.lifeforce + '</p><h2>Phoenix Altar</h2><div class="shop">';
    var i;
    for (i = 0; i < ALTAR.length; i++) {
      var def = ALTAR[i];
      var lv = meta.altar[def.id] || 0;
      var maxed = lv >= def.max;
      var cost = altarCost(def, lv);
      html += '<div class="shoprow"><span class="ico">' + icon(def.id) + '</span><div><b>' + esc(def.name) +
        '</b><small>Rank ' + lv + ' / ' + def.max + ' · ' + esc(def.line) + '</small></div>' +
        '<button type="button" class="btn-ghost" data-act="buy" data-id="' + def.id + '"' + (maxed || meta.lifeforce < cost ? ' disabled' : '') + '>' +
        (maxed ? 'Max' : cost) + '</button></div>';
    }
    html += '</div>';
    var starts = ['ember', 'missile', 'needle', 'lance', 'feather', 'ring', 'nova', 'chain', 'shield', 'spear'];
    var unlocked = 1 + (meta.altar.start || 0);
    html += '<p class="note">Starting skill</p><div class="picks">';
    for (i = 0; i < starts.length && i < unlocked; i++) {
      var wpn = findDef(WEAPONS, starts[i]);
      html += '<button type="button" class="chip' + (meta.startSkill === starts[i] ? ' on' : '') + '" data-act="startskill" data-id="' + starts[i] + '">' + esc(wpn.name) + '</button>';
    }
    html += '</div><button type="button" class="btn-ghost" data-act="back">Back</button></div>';
    return html;
  }

  function renderPips() {
    var html = '';
    var i;
    for (i = 1; i <= 10; i++) {
      var cls = '';
      if (phase === 'boss' || phase === 'ending' || i < run.round) cls = 'done';
      else if (i === run.round) cls = 'now';
      html += '<i class="' + cls + '"></i>';
    }
    $('pips').innerHTML = html;
  }

  function updateHud() {
    if (!run) return;
    $('pips').hidden = true;
    var bossIn = phase === 'boss' ? 'Boss fight' : ('Boss ' + fmtTime(Math.max(0, nextBoss - survive)));
    if (phone()) {
      $('place').textContent = Sim.systemName(run.system);
      $('stage-label').textContent = 'Lv ' + run.level + ' · ' + fmtTime(survive) + ' · ' + bossIn;
    } else {
      $('place').textContent = Sim.systemName(run.system) + ' · best ' + fmtTime((meta && meta.best[String(run.area)]) || 0);
      $('stage-label').textContent = 'Area ' + run.area + ' · Lv ' + run.level + ' · ' + fmtTime(survive) + ' · ' + bossIn;
    }
    $('lv').textContent = 'Lv ' + player.level;
    $('dmgstat').textContent = 'DMG ' + player.damage.toFixed(1);
    var need = xpNeed();
    $('xpfill').style.width = clamp(player.xp / need, 0, 1) * 100 + '%';
    var hpPct = player.maxHp ? clamp(player.hp / player.maxHp, 0, 1) : 0;
    $('hpfill').style.width = hpPct * 100 + '%';
    $('hptext').textContent = Math.max(0, Math.ceil(player.hp)) + ' / ' + player.maxHp;
    $('hpbar').classList.toggle('low', hpPct < 0.3 && hpPct > 0);
    var showBoss = !!(bossRef && (phase === 'boss' || phase === 'ending'));
    $('bossbox').hidden = !showBoss;
    $('pips').hidden = showBoss;
    if (showBoss && bossRef) {
      $('bossname').textContent = Sim.bossName(run.system);
      $('bossfill').style.width = (clamp(bossRef.hp / bossRef.maxHp, 0, 1) * 100) + '%';
    }
    var hint = $('keyhint');
    if (mode === 'play' && !panel) {
      hint.textContent = settings.follow
        ? (phone() ? 'Drag to glide' : 'Pointer leads the ship')
        : (phone() ? 'Joystick' : 'WASD or arrows');
    } else hint.textContent = '';
  }

  function placeShip() {
    player.x = w * 0.5;
    player.y = h * 0.78;
  }

  function clearField() {
    enemies = [];
    shots = [];
    orbs = [];
    beams = [];
    rings = [];
    zones = [];
    bossRef = null;
  }

  function beginRunLoadout() {
    var startId = findDef(WEAPONS, meta.startSkill) ? meta.startSkill : 'ember';
    player.level = 1;
    player.xp = 0;
    player.weapons = [{ id: startId, lv: 1 }];
    player.items = [];
    player.bonus = {};
    player.cds = {};
    player.revives = (meta.altar.revive || 0);
    player.rerolls = (meta.altar.reroll || 0);
    player.barrier = itemLv('barrier') > 0 ? 1 : 0;
    survive = 0;
    nextBoss = 120;
    recompute(false);
    player.hp = player.maxHp;
  }

  function startStage(system, area, level) {
    run = { system: system, area: area, level: level, round: 1 };
    mode = 'play';
    panel = null;
    phase = 'intro';
    introT = 1.3;
    fresh = false;
    beginRunLoadout();
    player.iframe = 0.5;
    clearField();
    AudioBus.setBoss(false);
    hideToast();
    showToast(Sim.systemName(system).toUpperCase(), 'Area ' + area + '  ·  Level ' + level, 1400);
    setScreen('');
    renderPips();
    updateHud();
    flushSave();
    requestAnimationFrame(function () {
      resize();
      placeShip();
    });
  }

  function roundSeconds() {
    return 10 + Math.min(4, run.round) * 0.45;
  }

  function startRound(n) {
    run.round = n;
    phase = 'wave';
    roundT = roundSeconds();
    spawnT = 0.35;
    bossRef = null;
    AudioBus.setBoss(false);
    showToast('ROUND ' + n, '', 800);
    renderPips();
    updateHud();
  }

  function beginBoss() {
    phase = 'boss';
    enemies = enemies.filter(function () { return false; });
    shots = shots.filter(function (s) { return s.friendly; });
    var e = spawnEnemy('boss', w * 0.5, -40);
    e.y = h * 0.2;
    e.hp = e.maxHp = Math.round(260 * (1 + (stageNum() - 1) * 0.12));
    e.shotCd = 1.2;
    e.spin = 0;
    bossRef = e;
    AudioBus.setBoss(true);
    AudioBus.boss();
    addShake(0.4);
    showToast('BOSS', Sim.bossName(run.system).toUpperCase(), 1500);
    renderPips();
  }

  function defeatBoss() {
    if (phase === 'ending' || panel === 'victory') return;
    var beaten = { system: run.system, area: run.area, level: run.level };
    var nxt = Sim.nextStage(beaten.system, beaten.area, beaten.level);
    if (Sim.stageIndex(beaten.system, beaten.area, beaten.level) >= Sim.stageIndex(frontier.system, frontier.area, frontier.level)) {
      frontier = { system: nxt.system, area: nxt.area, level: nxt.level };
    }
    pending = { beaten: beaten, next: nxt };
    AudioBus.setBoss(false);
    AudioBus.victory();
    addShake(0.55);
    nextBoss = survive + 120;
    phase = 'survive';
    bossRef = null;
    showToast('BOSS DOWN', 'Keep flying. Next boss in 2:00', 1600);
    panel = 'victory';
    setScreen(victoryHtml());
    flushSave();
  }

  function threat() {
    return (stageNum() - 1) * 0.08 + (survive / 60) * 0.28;
  }

  function spawnEnemy(kind, x, y) {
    var t = threat();
    var mult = kind === 'brute' ? 3.4 : kind === 'raider' ? 1.5 : kind === 'spitter' ? 1.15 : kind === 'boss' ? 1 : 0.85;
    var e = {
      id: nextId++,
      kind: kind,
      x: x, y: y,
      hp: Math.round((10 + t * 14) * mult),
      maxHp: 0,
      speed: (kind === 'brute' ? 28 : kind === 'wisp' ? 62 : 46) * (1 + t * 0.25),
      touch: Math.round((kind === 'brute' ? 12 : 6) * (1 + t * 0.35)),
      alive: true,
      dying: 0,
      dieMax: kind === 'boss' ? 0.8 : 0.28,
      flash: 0,
      squash: 0,
      shotCd: 1.4 + Math.random(),
      wobble: Math.random() * 6,
      ringCd: 0
    };
    e.maxHp = e.hp;
    enemies.push(e);
    return e;
  }

  function pickKind() {
    var r = survive / 40;
    var roll = Math.random();
    if (r <= 1) return 'wisp';
    if (r < 2) return roll < 0.75 ? 'wisp' : 'raider';
    if (r < 3) return roll < 0.55 ? 'wisp' : roll < 0.85 ? 'raider' : 'spitter';
    if (roll < 0.4) return 'wisp';
    if (roll < 0.7) return 'raider';
    if (roll < 0.88) return 'spitter';
    return 'brute';
  }

  function spawnWaveOne() {
    var cap = phone() ? 22 : 36;
    cap = Math.min(cap, 7 + Math.floor(survive / 25));
    var alive = 0;
    var i;
    for (i = 0; i < enemies.length; i++) if (enemies[i].alive && enemies[i].kind !== 'boss') alive += 1;
    if (alive >= cap) return;
    var edge = Math.random();
    var x;
    var y;
    if (edge < 0.62) {
      x = 16 + Math.random() * (w - 32);
      y = -28;
    } else if (edge < 0.81) {
      x = -28;
      y = 24 + Math.random() * h * 0.45;
    } else {
      x = w + 28;
      y = 24 + Math.random() * h * 0.45;
    }
    spawnEnemy(pickKind(), x, y);
  }

  function livingCount() {
    var n = 0;
    var i;
    for (i = 0; i < enemies.length; i++) if (enemies[i].alive && enemies[i].kind !== 'boss') n += 1;
    return n;
  }

  function nearestEnemy(x, y, range) {
    var best = null;
    var bestD = range || 1e9;
    var i;
    for (i = 0; i < enemies.length; i++) {
      var e = enemies[i];
      if (!e.alive) continue;
      var d = hypot(e.x - x, e.y - y);
      if (d < bestD) { bestD = d; best = e; }
    }
    return best;
  }

  function addShake(n) {
    if (reduceMotion) return;
    trauma = Math.min(1, trauma + n);
  }

  function emitParticle(x, y, vx, vy, life, color, size) {
    if (particles.length < (phone() ? 90 : 160)) {
      particles.push({ on: true, x: x, y: y, vx: vx, vy: vy, life: life, age: 0, color: color, size: size });
      return;
    }
    var limit = particles.length;
    var p = particles[pCursor % limit];
    pCursor = (pCursor + 1) % limit;
    p.on = true;
    p.x = x; p.y = y; p.vx = vx; p.vy = vy; p.life = life; p.age = 0; p.color = color; p.size = size;
  }

  function burst(x, y, color, n, speed) {
    var count = phone() ? Math.max(2, n >> 1) : n;
    var i;
    for (i = 0; i < count; i++) {
      var a = Math.random() * Math.PI * 2;
      var v = speed * (0.4 + Math.random());
      emitParticle(x, y, Math.cos(a) * v, Math.sin(a) * v, 0.25 + Math.random() * 0.25, color, 2 + Math.random() * 2.5);
    }
  }

  function floatText(text, x, y, color, scale) {
    if (floats.length > 36) floats.shift();
    floats.push({ text: String(text), x: x, y: y, color: color, scale: scale || 1, age: 0, life: 0.7, vy: -36 });
  }

  function dropOrb(x, y, amount, kind) {
    if (orbs.length > 48) orbs.shift();
    orbs.push({
      x: x, y: y, amount: amount, kind: kind || 'xp',
      vx: (Math.random() - 0.5) * 50,
      vy: (Math.random() - 0.5) * 40,
      c: kind === 'life' ? '#ffb15a' : '#7ef6ff'
    });
  }

  function hurt(amount) {
    if (player.iframe > 0 || player.hp <= 0 || frozen()) return;
    if (player.barrier > 0) {
      player.barrier -= 1;
      player.iframe = 0.45;
      floatText('Block', player.x, player.y - 18, '#7ef6ff', 1);
      return;
    }
    amount = Math.max(1, Math.round(amount - (player.armor || 0)));
    player.hp -= amount;
    player.iframe = 0.55;
    player.hurt = 0.22;
    addShake(0.28);
    AudioBus.hurt();
    floatText('-' + amount, player.x, player.y - 18, '#ff5d73', 1.05);
    if (itemLv('thorns') > 0) {
      var foe = nearestEnemy(player.x, player.y, 70);
      if (foe) damageEnemy(foe, 6 * itemLv('thorns') * player.damage);
    }
    if (player.hp <= 0) {
      if (player.revives > 0) {
        player.revives -= 1;
        player.hp = Math.round(player.maxHp * 0.55);
        player.iframe = 1.5;
        showToast('SECOND DAWN', player.revives + ' left', 900);
        return;
      }
      player.hp = 0;
      mode = 'play';
      panel = 'dead';
      AudioBus.die();
      burst(player.x, player.y, '#ff7a2f', 20, 80);
      setScreen(deadHtml());
      syncChrome();
    }
  }

  function damageEnemy(e, amount) {
    if (!e || !e.alive) return;
    if (player.crit && Math.random() < player.crit) amount *= 2;
    var dealt = Math.max(1, Math.round(amount));
    if (player.leech) player.hp = Math.min(player.maxHp, player.hp + dealt * player.leech);
    e.hp -= dealt;
    e.flash = 1;
    e.squash = 1;
    floatText(dealt, e.x, e.y - 12, '#ffe6c8', 1);
    if (e.hp <= 0) killEnemy(e);
  }

  function killEnemy(e) {
    if (!e.alive) return;
    e.alive = false;
    e.dying = e.dieMax;
    burst(e.x, e.y, '#ff8a3d', e.kind === 'boss' ? 22 : 8, 70);
    if (rings.length < 12) rings.push({ x: e.x, y: e.y, life: 0.28, max: 0.28, color: '#ffb15a' });
    addShake(e.kind === 'boss' ? 0.5 : 0.08);
    if (e.kind === 'boss') {
      bossRef = e;
      dropOrb(e.x, e.y, Math.round(18 * (player.goldMul || 1)), 'life');
      dropOrb(e.x - 14, e.y + 8, Math.round(14 * (player.xpMul || 1)), 'xp');
      defeatBoss();
      return;
    }
    AudioBus.pop();
    var xp = Math.round((e.kind === 'brute' ? 5 : e.kind === 'raider' ? 3 : 2) * (player.xpMul || 1) * (1 + itemLv('luck') * 0.08));
    dropOrb(e.x, e.y, xp, 'xp');
    var lifeChance = 0.14 + itemLv('luck') * 0.02;
    if (Math.random() < lifeChance) {
      var pile = Math.max(1, Math.round((1 + stageNum() * 0.15) * (player.goldMul || 1)));
      dropOrb(e.x + 10, e.y, pile, 'life');
    }
  }

  function gainLife(n) {
    meta.lifeforce += Math.max(1, Math.round(n));
    floatText('+' + Math.round(n), player.x, player.y - 28, '#ffb15a', 1);
    requestSave();
  }

  function fmtTime(s) {
    s = Math.max(0, Math.floor(s));
    var m = Math.floor(s / 60);
    var r = s % 60;
    return m + ':' + (r < 10 ? '0' : '') + r;
  }

  function openLevelUp() {
    if (panel === 'level') return;
    player.xp -= xpNeed();
    player.level += 1;
    recompute(false);
    player.hp = Math.min(player.maxHp, player.hp + 8);
    cards = rollCards();
    AudioBus.level();
    openPanel('level');
    flushSave();
  }

  function grantXp(n, quiet) {
    player.xp += n;
    if (!quiet && mode === 'play' && panel !== 'level' && player.xp >= xpNeed()) openLevelUp();
    else requestSave();
    updateHud();
  }

  function statCard() {
    var pick = STATS[(Math.random() * STATS.length) | 0];
    return { kind: 'stat', id: pick.id, lv: (player.bonus[pick.id] || 0) + 1, upgrade: true };
  }

  function offerList(catalog, ownedList, cap) {
    var pool = [];
    var i;
    var full = ownedList.length >= cap;
    for (i = 0; i < catalog.length; i++) {
      var have = owned(ownedList, catalog[i].id);
      if (have && have.lv < 5) pool.push({ id: catalog[i].id, lv: have.lv + 1, upgrade: true });
      else if (!have && !full) pool.push({ id: catalog[i].id, lv: 1, upgrade: false });
    }
    return pool;
  }

  function rollCards() {
    var skills = offerList(WEAPONS, player.weapons, 6);
    var items = offerList(ITEMS, player.items, 6);
    var skill = skills.length ? skills[(Math.random() * skills.length) | 0] : null;
    var item = items.length ? items[(Math.random() * items.length) | 0] : null;
    var cardsOut = [
      skill ? { kind: 'weapon', id: skill.id, lv: skill.lv, upgrade: skill.upgrade } : statCard(),
      item ? { kind: 'item', id: item.id, lv: item.lv, upgrade: item.upgrade } : statCard(),
      statCard()
    ];
    var i;
    for (i = cardsOut.length - 1; i > 0; i--) {
      var j = (Math.random() * (i + 1)) | 0;
      var tmp = cardsOut[i];
      cardsOut[i] = cardsOut[j];
      cardsOut[j] = tmp;
    }
    return cardsOut;
  }

  function applyCard(c) {
    if (c.kind === 'stat') {
      player.bonus[c.id] = (player.bonus[c.id] || 0) + 1;
      if (c.id === 'hp') player.hp += 12;
    } else if (c.kind === 'weapon') {
      var wpn = owned(player.weapons, c.id);
      if (wpn) wpn.lv = c.lv;
      else if (player.weapons.length < 6) player.weapons.push({ id: c.id, lv: 1 });
    } else if (c.kind === 'item') {
      var it = owned(player.items, c.id);
      if (it) it.lv = c.lv;
      else if (player.items.length < 6) player.items.push({ id: c.id, lv: 1 });
      if (c.id === 'revive') player.revives += 1;
      if (c.id === 'barrier') player.barrier = (player.barrier || 0) + 1;
    }
    recompute(true);
    player.hp = Math.min(player.maxHp, player.hp + 4);
    flushSave();
  }

  function fireFriendly(x, y, vx, vy, dmg, life, homing, kind) {
    if (shots.length > (phone() ? 70 : 120)) return null;
    var shot = {
      x: x, y: y, vx: vx, vy: vy, dmg: dmg, life: life, max: life,
      homing: homing, friendly: true, kind: kind, r: kind === 'feather' ? 7 : 6, pierce: 0, split: 0
    };
    shots.push(shot);
    return shot;
  }

  function fireHostile(x, y, vx, vy, dmg) {
    if (shots.length > (phone() ? 80 : 140)) return;
    shots.push({ x: x, y: y, vx: vx, vy: vy, dmg: dmg, life: 4.5, friendly: false, kind: 'foe', r: 7, homing: 0 });
  }

  function updateWeapons(dt) {
    var i;
    player.spin += dt * 1.6;
    for (i = 0; i < player.weapons.length; i++) {
      var wpn = player.weapons[i];
      var lv = wpn.lv;
      var aim = 1 + (lv - 1) * 0.2;
      player.cds[wpn.id] = (player.cds[wpn.id] || 0) - dt * player.rate;
      if (wpn.id === 'ember' && player.cds.ember <= 0) {
        var target = nearestEnemy(player.x, player.y, 420 + lv * 40);
        if (target) {
          var count = 1 + Math.floor((lv - 1) / 2) + itemLv('volley');
          var k;
          for (k = 0; k < count; k++) {
            var ang = Math.atan2(target.y - player.y, target.x - player.x) + (k - (count - 1) / 2) * 0.18;
            var sp = 280 + lv * 16;
            fireFriendly(player.x, player.y, Math.cos(ang) * sp, Math.sin(ang) * sp, (7 + lv * 3) * player.damage, 1.4, 2.2 * aim, 'ember');
          }
          player.cds.ember = 0.48 - Math.min(0.16, (lv - 1) * 0.03);
          AudioBus.shot();
        }
      }
      if (wpn.id === 'feather' && player.cds.feather <= 0) {
        var foe = nearestEnemy(player.x, player.y, 460 + lv * 30);
        if (foe) {
          var base = Math.atan2(foe.y - player.y, foe.x - player.x);
          var n = 2 + lv;
          var k2;
          for (k2 = 0; k2 < n; k2++) {
            var a = base + (k2 - (n - 1) / 2) * (0.34 - lv * 0.03);
            fireFriendly(player.x, player.y, Math.cos(a) * 250, Math.sin(a) * 250, (5 + lv * 2) * player.damage, 1.1, lv >= 4 ? 0.6 : 0, 'feather');
          }
          player.cds.feather = 0.85 - (lv - 1) * 0.06;
          AudioBus.wing();
        }
      }
      if (wpn.id === 'lance' && player.cds.lance <= 0) {
        var beamTarget = nearestEnemy(player.x, player.y, 520 + lv * 20);
        if (beamTarget) {
          var angB = Math.atan2(beamTarget.y - player.y, beamTarget.x - player.x);
          var reach = (210 + lv * 28) * player.area;
          var width = 18 + lv * 4;
          var j;
          for (j = 0; j < enemies.length; j++) {
            var en = enemies[j];
            if (!en.alive) continue;
            var relx = en.x - player.x;
            var rely = en.y - player.y;
            var along = relx * Math.cos(angB) + rely * Math.sin(angB);
            var side = Math.abs(-relx * Math.sin(angB) + rely * Math.cos(angB));
            if (along > 0 && along < reach && side < width + 10) damageEnemy(en, (9 + lv * 4) * player.damage);
          }
          beams.push({ ang: angB, life: 0.16, max: 0.16, reach: reach, width: width });
          player.cds.lance = 1.35 - (lv - 1) * 0.1;
          AudioBus.lance();
        }
      }
      if (wpn.id === 'nova' && player.cds.nova <= 0) {
        var radius = (78 + lv * 14) * player.area;
        var j2;
        for (j2 = 0; j2 < enemies.length; j2++) {
          var foe2 = enemies[j2];
          if (!foe2.alive) continue;
          if (hypot(foe2.x - player.x, foe2.y - player.y) < radius + 16) damageEnemy(foe2, (8 + lv * 3) * player.damage);
        }
        if (rings.length < 14) rings.push({ x: player.x, y: player.y, life: 0.35, max: 0.35, color: '#7ef6ff', r: radius });
        player.cds.nova = 4.6 - (lv - 1) * 0.35;
        AudioBus.nova();
        addShake(0.2);
      }
      castExtra(wpn, lv);
    }
    updateZones(dt);
  }

  function castExtra(wpn, lv) {
    var id = wpn.id;
    var reach = (1 + itemLv('scope') * 0.12);
    if (id === 'missile' && player.cds.missile <= 0) {
      var t = nearestEnemy(player.x, player.y, 500 * reach);
      if (!t) return;
      var n = 1 + Math.floor(lv / 3);
      var k;
      for (k = 0; k < n; k++) {
        var ang = Math.atan2(t.y - player.y, t.x - player.x) + (k - (n - 1) / 2) * 0.4;
        fireFriendly(player.x, player.y, Math.cos(ang) * 160, Math.sin(ang) * 160, (14 + lv * 5) * player.damage, 2.4, 3.4, 'missile');
      }
      player.cds.missile = 1.7 - lv * 0.1;
      AudioBus.shot();
    }
    if (id === 'chain' && player.cds.chain <= 0) {
      var fromX = player.x;
      var fromY = player.y;
      var used = {};
      var jumps = 1 + lv;
      var j;
      var hit = false;
      for (j = 0; j < jumps; j++) {
        var best = null;
        var bestD = (220 + lv * 24) * reach;
        var e;
        for (e = 0; e < enemies.length; e++) {
          var foe = enemies[e];
          if (!foe.alive || used[foe.id]) continue;
          var d = hypot(foe.x - fromX, foe.y - fromY);
          if (d < bestD) { bestD = d; best = foe; }
        }
        if (!best) break;
        damageEnemy(best, (8 + lv * 3) * player.damage);
        beams.push({ x1: fromX, y1: fromY, x2: best.x, y2: best.y, life: 0.14, max: 0.14, chain: true });
        used[best.id] = true;
        fromX = best.x;
        fromY = best.y;
        hit = true;
      }
      if (hit) {
        player.cds.chain = 1.5 - lv * 0.08;
        AudioBus.lance();
      }
    }
    if (id === 'trail' && player.cds.trail <= 0) {
      zones.push({ x: player.x, y: player.y + 16, r: (22 + lv * 4) * player.area, life: (0.7 + lv * 0.08) * (1 + itemLv('duration') * 0.12), dmg: (3 + lv) * player.damage, tick: 0 });
      player.cds.trail = 0.28;
    }
    if (id === 'mine' && player.cds.mine <= 0) {
      zones.push({ x: player.x, y: player.y + 20, r: (40 + lv * 6) * player.area, life: 1.6 + itemLv('duration') * 0.15, dmg: (10 + lv * 4) * player.damage, tick: 1.5, mine: true });
      player.cds.mine = 2.4 - lv * 0.15;
    }
    if (id === 'shield' && player.cds.shield <= 0) {
      var rad = (70 + lv * 8) * player.area;
      var i;
      for (i = 0; i < enemies.length; i++) {
        var foe2 = enemies[i];
        if (!foe2.alive) continue;
        var d2 = hypot(foe2.x - player.x, foe2.y - player.y);
        if (d2 < rad) {
          damageEnemy(foe2, (6 + lv * 2) * player.damage);
          var push = (rad - d2) * 0.35;
          foe2.x += (foe2.x - player.x) / (d2 || 1) * push;
          foe2.y += (foe2.y - player.y) / (d2 || 1) * push;
        }
      }
      if (rings.length < 14) rings.push({ x: player.x, y: player.y, life: 0.28, max: 0.28, color: '#7ef6ff', r: rad });
      player.cds.shield = 3.2 - lv * 0.18;
      AudioBus.nova();
    }
    if (id === 'spear' && player.cds.spear <= 0) {
      var aim = nearestEnemy(player.x, player.y, 480 * reach);
      if (aim) {
        var a = Math.atan2(aim.y - player.y, aim.x - player.x);
        var spear = fireFriendly(player.x, player.y, Math.cos(a) * 420, Math.sin(a) * 420, (9 + lv * 3) * player.damage, 0.7, 0, 'spear');
        if (spear) spear.pierce = lv;
        player.cds.spear = 0.7 - lv * 0.04;
        AudioBus.shot();
      }
    }
    if (id === 'swarm' && player.cds.swarm <= 0) {
      var n2 = 4 + lv + itemLv('volley');
      var k2;
      for (k2 = 0; k2 < n2; k2++) {
        var a2 = Math.random() * Math.PI * 2;
        fireFriendly(player.x, player.y, Math.cos(a2) * 220, Math.sin(a2) * 220, (3 + lv) * player.damage, 0.8, 1.2, 'ember');
      }
      player.cds.swarm = 1.15 - lv * 0.06;
      AudioBus.shot();
    }
    if (id === 'comet' && player.cds.comet <= 0) {
      var t2 = nearestEnemy(player.x, player.y, 520 * reach);
      if (t2) {
        zones.push({ x: t2.x, y: t2.y, r: (28 + lv * 5) * player.area, life: 0.35, dmg: (12 + lv * 4) * player.damage, tick: 0.05, mine: true });
        player.cds.comet = 1.6 - lv * 0.08;
      }
    }
    if (id === 'needle' && player.cds.needle <= 0) {
      var t3 = nearestEnemy(player.x, player.y, 460 * reach);
      if (t3) {
        var a3 = Math.atan2(t3.y - player.y, t3.x - player.x);
        fireFriendly(player.x, player.y, Math.cos(a3) * 520, Math.sin(a3) * 520, (4 + lv * 2) * player.damage, 0.55, 0, 'needle');
        player.cds.needle = 0.22 - Math.min(0.08, lv * 0.012);
        AudioBus.shot();
      }
    }
    if (id === 'helix' && player.cds.helix <= 0) {
      var spin = player.spin * 3;
      fireFriendly(player.x, player.y, Math.cos(spin) * 260, Math.sin(spin) * 260, (5 + lv * 2) * player.damage, 1, 0.4, 'feather');
      fireFriendly(player.x, player.y, Math.cos(spin + Math.PI) * 260, Math.sin(spin + Math.PI) * 260, (5 + lv * 2) * player.damage, 1, 0.4, 'feather');
      player.cds.helix = 0.42;
    }
    if (id === 'flare' && player.cds.flare <= 0) {
      var t4 = nearestEnemy(player.x, player.y, 400 * reach);
      if (t4) {
        t4.burn = (t4.burn || 0) + (1.2 + lv * 0.25) * (1 + itemLv('duration') * 0.1);
        t4.burnDmg = (4 + lv) * player.damage;
        player.cds.flare = 1.3 - lv * 0.06;
      }
    }
    if (id === 'prism' && player.cds.prism <= 0) {
      var t5 = nearestEnemy(player.x, player.y, 440 * reach);
      if (t5) {
        var a5 = Math.atan2(t5.y - player.y, t5.x - player.x);
        var prism = fireFriendly(player.x, player.y, Math.cos(a5) * 300, Math.sin(a5) * 300, (6 + lv * 2) * player.damage, 1.1, 0.5, 'prism');
        if (prism) prism.split = lv;
        player.cds.prism = 0.9;
        AudioBus.shot();
      }
    }
    if (id === 'halo' && player.cds.halo <= 0) {
      var rad2 = (48 + lv * 6) * player.area;
      var h;
      for (h = 0; h < enemies.length; h++) {
        var foe3 = enemies[h];
        if (foe3.alive && hypot(foe3.x - player.x, foe3.y - player.y) < rad2) damageEnemy(foe3, (2 + lv) * player.damage);
      }
      player.cds.halo = 0.45;
    }
    if (id === 'rain' && player.cds.rain <= 0) {
      var drops = 2 + Math.floor(lv / 2) + itemLv('volley');
      var r;
      for (r = 0; r < drops; r++) {
        var tx = player.x + (Math.random() - 0.5) * 220 * player.area;
        fireFriendly(tx, player.y - 180, 0, 280, (6 + lv * 2) * player.damage, 1.2, 0, 'ember');
      }
      player.cds.rain = 1.4 - lv * 0.08;
    }
  }

  function updateZones(dt) {
    var i;
    var j;
    for (i = zones.length - 1; i >= 0; i--) {
      var z = zones[i];
      z.life -= dt;
      z.tick -= dt;
      if (z.tick <= 0) {
        for (j = 0; j < enemies.length; j++) {
          var e = enemies[j];
          if (e.alive && hypot(e.x - z.x, e.y - z.y) < z.r) damageEnemy(e, z.dmg);
        }
        if (z.mine) {
          if (rings.length < 14) rings.push({ x: z.x, y: z.y, life: 0.25, max: 0.25, color: '#ffb15a', r: z.r });
          z.life = 0;
        } else z.tick = 0.25;
      }
      if (z.life <= 0) zones.splice(i, 1);
    }
  }

  function updateRing(dt) {
    spinOrbit('ring', 1, dt);
    spinOrbit('ward', -0.65, dt);
  }

  function spinOrbit(id, dir, dt) {
    var ring = owned(player.weapons, id);
    if (!ring) return;
    var count = ring.lv + 1;
    var radius = (54 + ring.lv * 6) * player.area;
    var i;
    var k;
    for (i = 0; i < count; i++) {
      var a = player.spin * dir * (1.1 + ring.lv * 0.08) + (i / count) * Math.PI * 2;
      var x = player.x + Math.cos(a) * radius;
      var y = player.y + Math.sin(a) * radius;
      for (k = 0; k < enemies.length; k++) {
        var e = enemies[k];
        if (!e.alive || e.ringCd > 0) continue;
        if (hypot(e.x - x, e.y - y) < 16 + ring.lv * 2) {
          damageEnemy(e, (4 + ring.lv * 2) * player.damage);
          e.ringCd = 0.32;
        }
      }
    }
  }

  function updateEnemies(dt) {
    var i;
    for (i = 0; i < enemies.length; i++) {
      var e = enemies[i];
      e.flash = Math.max(0, e.flash - dt * 6);
      e.squash = Math.max(0, e.squash - dt * 6);
      e.ringCd = Math.max(0, (e.ringCd || 0) - dt);
      if (e.burn > 0) {
        e.burn -= dt;
        e.burnTick = (e.burnTick || 0) - dt;
        if (e.burnTick <= 0) {
          damageEnemy(e, e.burnDmg || 4);
          e.burnTick = 0.4;
        }
      }
      if (!e.alive) {
        e.dying -= dt;
        continue;
      }
      if (e.kind === 'boss') {
        var goal = w * 0.5 + Math.sin(time * 0.7) * Math.min(140, w * 0.22);
        e.x += clamp(goal - e.x, -1, 1) * 70 * dt;
        e.y += (h * 0.2 - e.y) * Math.min(1, dt * 2);
        e.shotCd -= dt;
        if (e.shotCd <= 0) {
          e.shotCd = 1.7;
          e.spin = (e.spin || 0) + 0.35;
          var n = 8;
          var k;
          for (k = 0; k < n; k++) {
            var a = e.spin + k * Math.PI * 2 / n;
            fireHostile(e.x, e.y + 20, Math.cos(a) * 100, Math.sin(a) * 100, 9);
          }
          var aim = Math.atan2(player.y - e.y, player.x - e.x);
          fireHostile(e.x, e.y, Math.cos(aim) * 150, Math.sin(aim) * 150, 10);
        }
      } else {
        var dx = player.x - e.x;
        var dy = player.y - e.y;
        var d = hypot(dx, dy) || 1;
        e.wobble += dt * 3;
        e.x += (dx / d) * e.speed * dt + Math.cos(e.wobble) * 10 * dt;
        e.y += (dy / d) * e.speed * dt;
        if (e.kind === 'spitter') {
          e.shotCd -= dt;
          if (e.shotCd <= 0 && d < 340) {
            e.shotCd = run.round < 6 ? 2.4 : 1.7;
            var ang = Math.atan2(dy, dx);
            if (survive > 80) {
              fireHostile(e.x, e.y, Math.cos(ang - 0.35) * 120, Math.sin(ang - 0.35) * 120, e.touch);
              fireHostile(e.x, e.y, Math.cos(ang + 0.35) * 120, Math.sin(ang + 0.35) * 120, e.touch);
            }
            fireHostile(e.x, e.y, Math.cos(ang) * 130, Math.sin(ang) * 130, e.touch);
          }
        }
        if (d < 22 + (e.kind === 'brute' ? 10 : 0)) hurt(e.touch);
      }
    }
  }

  function updateShots(dt) {
    var i;
    var j;
    for (i = shots.length - 1; i >= 0; i--) {
      var s = shots[i];
      if (s.homing) {
        var t = nearestEnemy(s.x, s.y, 360);
        if (t) {
          var dx = t.x - s.x;
          var dy = t.y - s.y;
          var d = hypot(dx, dy) || 1;
          var sp = hypot(s.vx, s.vy) || 200;
          s.vx += (dx / d * sp - s.vx) * Math.min(1, s.homing * dt);
          s.vy += (dy / d * sp - s.vy) * Math.min(1, s.homing * dt);
        }
      }
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      s.life -= dt;
      if (s.life <= 0 || s.x < -40 || s.y < -40 || s.x > w + 40 || s.y > h + 40) {
        shots.splice(i, 1);
        continue;
      }
      if (s.friendly) {
        for (j = 0; j < enemies.length; j++) {
          var e = enemies[j];
          if (!e.alive) continue;
          var hitR = (e.kind === 'boss' ? 36 : 18) + s.r;
          if (hypot(e.x - s.x, e.y - s.y) < hitR) {
            damageEnemy(e, s.dmg);
            AudioBus.hit();
            if (s.split) {
              var a = Math.random() * 6;
              fireFriendly(s.x, s.y, Math.cos(a) * 180, Math.sin(a) * 180, s.dmg * 0.6, 0.6, 0.8, 'feather');
              fireFriendly(s.x, s.y, Math.cos(a + 2) * 180, Math.sin(a + 2) * 180, s.dmg * 0.6, 0.6, 0.8, 'feather');
            }
            if (s.pierce > 0) {
              s.pierce -= 1;
              s.x += s.vx * 0.02;
              s.y += s.vy * 0.02;
              break;
            }
            shots.splice(i, 1);
            break;
          }
        }
      } else if (hypot(player.x - s.x, player.y - s.y) < 16 + s.r) {
        hurt(s.dmg);
        shots.splice(i, 1);
      }
    }
  }

  function updateOrbs(dt) {
    var reach = 78 * player.magnet;
    var i;
    for (i = orbs.length - 1; i >= 0; i--) {
      var o = orbs[i];
      var dx = player.x - o.x;
      var dy = player.y - o.y;
      var d = hypot(dx, dy) || 1;
      if (d < reach) {
        o.x += (dx / d) * 320 * dt;
        o.y += (dy / d) * 320 * dt;
      } else {
        o.x += o.vx * dt;
        o.y += o.vy * dt;
        o.vx *= 0.92;
        o.vy *= 0.92;
      }
      if (d < 20) {
        if (o.kind === 'life') gainLife(o.amount);
        else grantXp(o.amount);
        AudioBus.orb();
        orbs.splice(i, 1);
      }
    }
  }

  function updateMove(dt) {
    var ix = 0;
    var iy = 0;
    if (settings.follow && (pointer.inside || pointer.down)) {
      var dx = pointer.x - player.x;
      var dy = pointer.y - player.y;
      var dist = hypot(dx, dy);
      if (dist > 8) {
        var step = Math.min(player.speed * dt, dist);
        player.x += (dx / dist) * step;
        player.y += (dy / dist) * step;
      }
    } else if (!settings.follow) {
      ix = (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0);
      iy = (keys.ArrowDown || keys.KeyS ? 1 : 0) - (keys.ArrowUp || keys.KeyW ? 1 : 0);
      if (joy.active) { ix = joy.dx; iy = joy.dy; }
      var mag = hypot(ix, iy);
      if (mag > 0.08) {
        player.x += (ix / mag) * player.speed * dt;
        player.y += (iy / mag) * player.speed * dt;
      }
    }
    var pad = shipW() * 0.45;
    player.x = clamp(player.x, pad, Math.max(pad, w - pad));
    player.y = clamp(player.y, pad, Math.max(pad, h - pad));
  }

  function updatePlay(dt) {
    player.iframe = Math.max(0, player.iframe - dt);
    player.hurt = Math.max(0, player.hurt - dt);
    if (player.regen) player.hp = Math.min(player.maxHp, player.hp + player.regen * dt);
    if (phase === 'intro') {
      introT -= dt;
      if (introT <= 0) phase = 'survive';
      updateHud();
      return;
    }
    if (phase === 'ending') {
      endingT -= dt;
      if (endingT <= 0) {
        hideToast();
        panel = 'victory';
        setScreen(victoryHtml());
      }
      updateHud();
      return;
    }
    updateMove(dt);
    if (phase === 'survive' || phase === 'boss') {
      if (phase === 'survive') {
        survive += dt;
        var best = meta.best[String(run.area)] || 0;
        if (survive > best) {
          meta.best[String(run.area)] = Math.floor(survive);
          requestSave();
        }
        if (!bossRef && survive >= nextBoss) beginBoss();
      }
      spawnT -= dt;
      var gap = Math.max(0.38, 0.95 - Math.min(0.5, survive / 180));
      if (spawnT <= 0 && phase === 'survive') {
        spawnWaveOne();
        spawnT = gap;
      }
    }
    updateWeapons(dt);
    updateRing(dt);
    updateEnemies(dt);
    updateShots(dt);
    updateOrbs(dt);
    enemies = enemies.filter(function (e) { return e.alive || e.dying > 0; });
    updateHud();
  }

  function updateAmbient(dt) {
    var i;
    for (i = 0; i < stars.length; i++) {
      var s = stars[i];
      s.y += (8 + s.z * s.z * 90) * dt;
      if (s.y > h + 4) { s.y = -4; s.x = Math.random() * w; }
    }
    for (i = 0; i < particles.length; i++) {
      var p = particles[i];
      if (!p.on) continue;
      p.age += dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      if (p.age >= p.life) p.on = false;
    }
    for (i = floats.length - 1; i >= 0; i--) {
      floats[i].age += dt;
      floats[i].y += floats[i].vy * dt;
      if (floats[i].age >= floats[i].life) floats.splice(i, 1);
    }
    for (i = rings.length - 1; i >= 0; i--) {
      rings[i].life -= dt;
      if (rings[i].life <= 0) rings.splice(i, 1);
    }
    for (i = beams.length - 1; i >= 0; i--) {
      beams[i].life -= dt;
      if (beams[i].life <= 0) beams.splice(i, 1);
    }
    if (mode === 'title' || mode === 'help' || mode === 'plan' || mode === 'confirm') {
      player.x = w * 0.5 + Math.sin(time * 0.35) * Math.min(80, w * 0.08);
      player.y = h * 0.78;
    }
  }

  function update(dt) {
    time += dt;
    trauma = Math.max(0, trauma - dt * 1.4);
    tickSave(dt);
    tickToast();
    AudioBus.tick();
    updateAmbient(dt);
    if (mode === 'play' && !frozen()) updatePlay(dt);
  }

  function paintSprite(im, x, y, dw, rot, alpha, additive, anchor) {
    if (!im || !im.naturalWidth) return;
    var dh = dw * (im.naturalHeight / im.naturalWidth);
    ctx.save();
    ctx.translate(x, y);
    if (rot) ctx.rotate(rot);
    ctx.globalAlpha = alpha == null ? 1 : alpha;
    if (additive) ctx.globalCompositeOperation = 'lighter';
    ctx.drawImage(im, -dw / 2, -dh * (anchor == null ? 0.5 : anchor), dw, dh);
    ctx.restore();
  }

  function drawSpace() {
    ctx.fillStyle = '#05060e';
    ctx.fillRect(0, 0, w, h);
    var im = art.bg;
    if (!im || !im.naturalWidth) return;
    var cover = Math.max(w / im.naturalWidth, h / im.naturalHeight) * 1.18;
    var dw = im.naturalWidth * cover;
    var dh = im.naturalHeight * cover;
    var driftX = Math.sin(time * 0.07) * 20;
    var driftY = Math.cos(time * 0.05) * 16;
    ctx.drawImage(im, (w - dw) / 2 + driftX, (h - dh) / 2 + driftY, dw, dh);
  }

  function drawShip(t) {
    var bob = Math.sin(t * 2.2) * 2;
    var tilt = 0;
    if (!settings.follow) {
      var ix = (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0);
      if (joy.active) ix = joy.dx;
      tilt = clamp(ix * 0.25, -0.3, 0.3);
    } else if (pointer.inside || pointer.down) {
      tilt = clamp((pointer.x - player.x) / 400, -0.28, 0.28);
    }
    var pw = shipW();
    paintSprite(art.phoenix, player.x, player.y + bob, pw * 1.05, tilt, 0.2 + Math.sin(t * 16) * 0.05, true, 0.62);
    var dim = (player.iframe > 0 && Math.sin(t * 30) > 0.2) ? 0.7 : 1;
    paintSprite(art.phoenix, player.x, player.y + bob, pw, tilt, dim, false, 0.62);
    if (Math.random() < 0.6) {
      emitParticle(player.x + (Math.random() * 10 - 5), player.y + pw * 0.28, (Math.random() * 8 - 4), 30, 0.25, '#ff8a3d', 2);
    }
  }

  function drawEnemy(e, t) {
    var im = e.kind === 'boss' ? art.boss : art.enemy;
    if (!im || !im.naturalWidth) return;
    var depth = e.kind === 'boss' ? 1 : clamp(0.45 + (e.y / Math.max(1, h)) * 0.7, 0.45, 1.15);
    var ew = e.kind === 'boss' ? Math.min(w * 0.34, 300) : shipW() * (e.kind === 'brute' ? 1.15 : 0.85) * depth;
    var dh = ew * (im.naturalHeight / im.naturalWidth);
    ctx.save();
    ctx.translate(e.x, e.y);
    ctx.scale(1 + (e.squash || 0) * 0.08, 1 - (e.squash || 0) * 0.1);
    if (!e.alive) ctx.globalAlpha = Math.max(0, e.dying / e.dieMax);
    if (e.flash > 0.25) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = Math.min(0.7, e.flash);
      ctx.drawImage(im, -ew / 2, -dh / 2, ew, dh);
      ctx.restore();
    }
    ctx.drawImage(im, -ew / 2, -dh / 2, ew, dh);
    ctx.restore();
  }

  function drawRingWeapon() {
    drawOrbit('ring', 1, '#ff8a3d');
    drawOrbit('ward', -0.65, '#7ef6ff');
  }

  function drawOrbit(id, dir, color) {
    var ring = owned(player.weapons, id);
    if (!ring || mode !== 'play') return;
    var count = ring.lv + 1;
    var radius = (54 + ring.lv * 6) * player.area;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    var i;
    for (i = 0; i < count; i++) {
      var a = player.spin * dir * (1.1 + ring.lv * 0.08) + (i / count) * Math.PI * 2;
      var x = player.x + Math.cos(a) * radius;
      var y = player.y + Math.sin(a) * radius;
      var grd = ctx.createRadialGradient(x, y, 0, x, y, 10);
      grd.addColorStop(0, '#fff6d8');
      grd.addColorStop(0.5, color);
      grd.addColorStop(1, 'rgba(255,70,10,0)');
      ctx.fillStyle = grd;
      ctx.beginPath();
      ctx.arc(x, y, 10, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function render() {
    if (!ctx || w < 2 || h < 2) return;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    var mag = 0;
    if (trauma > 0 && !reduceMotion) mag = trauma * trauma * 14;
    ctx.save();
    if (mag) ctx.translate((Math.random() - 0.5) * mag, (Math.random() - 0.5) * mag);
    drawSpace();
    var i;
    ctx.globalAlpha = 0.7;
    for (i = 0; i < stars.length; i++) {
      var s = stars[i];
      ctx.fillStyle = s.color;
      ctx.globalAlpha = s.a;
      ctx.fillRect(s.x, s.y, s.size, s.size);
    }
    ctx.globalAlpha = 1;
    var list = enemies.slice().sort(function (a, b) { return a.y - b.y; });
    for (i = 0; i < list.length; i++) if (list[i].kind !== 'boss') drawEnemy(list[i], time);
    for (i = 0; i < list.length; i++) if (list[i].kind === 'boss') drawEnemy(list[i], time);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (i = 0; i < shots.length; i++) {
      var s = shots[i];
      var col = s.friendly ? (s.kind === 'feather' ? '#ffb15a' : '#ff8a3d') : '#ff4d8d';
      var grd = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.friendly ? 9 : 8);
      grd.addColorStop(0, '#fff');
      grd.addColorStop(0.45, col);
      grd.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grd;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.friendly ? 9 : 8, 0, Math.PI * 2);
      ctx.fill();
    }
    for (i = 0; i < orbs.length; i++) {
      var o = orbs[i];
      var og = ctx.createRadialGradient(o.x, o.y, 0, o.x, o.y, 8);
      og.addColorStop(0, '#fff');
      og.addColorStop(0.5, o.c);
      og.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = og;
      ctx.beginPath();
      ctx.arc(o.x, o.y, 8, 0, Math.PI * 2);
      ctx.fill();
    }
    for (i = 0; i < particles.length; i++) {
      var p = particles[i];
      if (!p.on) continue;
      ctx.globalAlpha = Math.max(0, 1 - p.age / p.life);
      var pg = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size * 2);
      pg.addColorStop(0, '#fff6d8');
      pg.addColorStop(1, 'rgba(255,90,20,0)');
      ctx.fillStyle = pg;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * 2, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
    for (i = 0; i < beams.length; i++) {
      var b = beams[i];
      ctx.save();
      ctx.globalAlpha = b.life / b.max;
      ctx.strokeStyle = '#e9fbff';
      ctx.lineWidth = 3;
      ctx.beginPath();
      if (b.chain) {
        ctx.moveTo(b.x1, b.y1);
        ctx.lineTo(b.x2, b.y2);
      } else {
        ctx.moveTo(player.x, player.y);
        ctx.lineTo(player.x + Math.cos(b.ang) * b.reach, player.y + Math.sin(b.ang) * b.reach);
      }
      ctx.stroke();
      ctx.strokeStyle = 'rgba(80,220,255,0.45)';
      ctx.lineWidth = b.width || 8;
      ctx.stroke();
      ctx.restore();
    }
    drawRingWeapon();
    var zi;
    for (zi = 0; zi < zones.length; zi++) {
      var z = zones[zi];
      ctx.save();
      ctx.globalAlpha = 0.35;
      ctx.fillStyle = z.mine ? 'rgba(255,120,40,0.35)' : 'rgba(255,90,20,0.28)';
      ctx.beginPath();
      ctx.arc(z.x, z.y, z.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
    for (i = 0; i < rings.length; i++) {
      var ring = rings[i];
      var rk = 1 - ring.life / ring.max;
      ctx.save();
      ctx.globalAlpha = (1 - rk) * 0.8;
      ctx.strokeStyle = ring.color;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(ring.x, ring.y, (ring.r || 16) * (0.4 + rk), 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
    if (player) drawShip(time);
    ctx.restore();
    for (i = 0; i < floats.length; i++) {
      var f = floats[i];
      ctx.globalAlpha = f.age > f.life * 0.6 ? 1 - (f.age - f.life * 0.6) / (f.life * 0.4) : 1;
      ctx.font = '800 ' + Math.round(15 * f.scale) + 'px ' + FONT;
      ctx.textAlign = 'center';
      ctx.lineWidth = 3;
      ctx.strokeStyle = 'rgba(0,0,0,0.65)';
      ctx.strokeText(f.text, f.x, f.y);
      ctx.fillStyle = f.color;
      ctx.fillText(f.text, f.x, f.y);
    }
    ctx.globalAlpha = 1;
    if (vignette) ctx.drawImage(vignette, 0, 0, w, h);
  }

  function seedStars() {
    stars = [];
    var n = phone() ? 40 : 70;
    var i;
    for (i = 0; i < n; i++) {
      var z = Math.random();
      stars.push({
        x: Math.random() * w,
        y: Math.random() * h,
        z: z,
        size: z > 0.8 ? 2 : 1.1,
        a: 0.25 + z * 0.55,
        color: Math.random() < 0.15 ? '#9aefff' : '#f4f7ff'
      });
    }
  }

  function buildVignette() {
    vignette = document.createElement('canvas');
    vignette.width = Math.max(2, w);
    vignette.height = Math.max(2, h);
    var g = vignette.getContext('2d');
    var rad = g.createRadialGradient(w * 0.5, h * 0.45, Math.min(w, h) * 0.2, w * 0.5, h * 0.5, Math.max(w, h) * 0.72);
    rad.addColorStop(0, 'rgba(0,0,0,0)');
    rad.addColorStop(1, 'rgba(0,0,0,0.45)');
    g.fillStyle = rad;
    g.fillRect(0, 0, w, h);
  }

  function applyLayout() {
    var ww = window.innerWidth;
    var hh = window.innerHeight;
    var coarse = window.matchMedia('(pointer: coarse)').matches;
    var orient = ww >= hh ? 'landscape' : 'portrait';
    document.body.dataset.layout = (ww >= 980 && orient === 'landscape' && !coarse) ? 'desktop' : 'phone';
    document.body.dataset.orient = orient;
  }

  function resize() {
    applyLayout();
    var ih = window.innerHeight + 'px';
    if (app.style.height !== ih) app.style.height = ih;
    var rect = stage.getBoundingClientRect();
    var nw = Math.max(2, Math.round(rect.width));
    var nh = Math.max(2, Math.round(rect.height));
    var nd = Math.min(phone() ? 1.35 : 1.75, window.devicePixelRatio || 1);
    if (nw === w && nh === h && nd === dpr && vignette) return;
    w = nw;
    h = nh;
    dpr = nd;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    buildVignette();
    seedStars();
    if (player && (player.x === 0 && player.y === 0)) placeShip();
  }

  function onAction(act, el) {
    AudioBus.unlock();
    if (act === 'music' || act === 'sfx' || act === 'follow' || act === 'autopause') {
      if (act === 'music') { settings.music = !settings.music; AudioBus.setMusic(settings.music); }
      if (act === 'sfx') { settings.sfx = !settings.sfx; AudioBus.setSfx(settings.sfx); }
      if (act === 'follow') settings.follow = !settings.follow;
      if (act === 'autopause') settings.autoPause = !settings.autoPause;
      AudioBus.ui();
      flushSave();
      syncChrome();
      if (panel === 'settings' || mode === 'title') setScreen(panel === 'settings' || mode !== 'title' ? settingsHtml() : titleHtml());
      if (mode === 'title' && panel !== 'settings') setScreen(titleHtml());
      return;
    }
    AudioBus.ui();
    if (act === 'begin' || act === 'continue') { startStage(frontier.system, frontier.area, frontier.level); return; }
    if (act === 'help') { mode = 'help'; panel = null; setScreen(helpHtml()); return; }
    if (act === 'plan') {
      plan.system = frontier.system; plan.area = frontier.area; plan.level = frontier.level;
      mode = 'plan'; panel = null; setScreen(planHtml()); return;
    }
    if (act === 'settings') {
      if (mode === 'title' || mode === 'help' || mode === 'plan') { mode = 'title'; }
      openPanel('settings');
      return;
    }
    if (act === 'stats') {
      if (mode !== 'play') return;
      if (panel === 'stats') closePanel();
      else openPanel('stats');
      return;
    }
    if (act === 'pause') {
      if (panel === 'pause') { panel = null; setScreen(''); syncChrome(); }
      else if (mode === 'play' && !panel) openPanel('pause');
      return;
    }
    if (act === 'resume') { panel = null; setScreen(''); syncChrome(); return; }
    if (act === 'close-panel') { closePanel(); return; }
    if (act === 'back') {
      if (mode === 'play') { panel = null; setScreen(''); syncChrome(); }
      else showTitle();
      return;
    }
    if (act === 'confirm') {
      mode = 'confirm';
      setScreen('<div class="card"><h2>New Storm</h2><p class="by">Lifeforce, altar ranks, and best times on this device will be erased.</p><button type="button" class="btn-primary" data-act="wipe">Erase and start</button><button type="button" class="btn-ghost" data-act="back">Back</button></div>');
      return;
    }
    if (act === 'wipe') {
      meta = {
        lifeforce: 0, best: {},
        altar: { might: 0, hp: 0, speed: 0, magnet: 0, xp: 0, gold: 0, revive: 0, reroll: 0, start: 0 },
        startSkill: 'ember'
      };
      frontier = { system: 1, area: 1, level: 1 };
      fresh = false;
      startStage(1, 1, 1);
      return;
    }
    if (act === 'keep') {
      panel = null;
      phase = 'survive';
      setScreen('');
      syncChrome();
      return;
    }
    if (act === 'reroll' && player.rerolls > 0) {
      player.rerolls -= 1;
      cards = rollCards();
      setScreen(levelHtml());
      return;
    }
    if (act === 'altar') {
      mode = 'title';
      panel = null;
      setScreen(altarHtml());
      syncChrome();
      return;
    }
    if (act === 'buy' && el) {
      var def = findDef(ALTAR, el.getAttribute('data-id'));
      if (def) {
        var rank = meta.altar[def.id] || 0;
        var cost = altarCost(def, rank);
        if (rank < def.max && meta.lifeforce >= cost) {
          meta.lifeforce -= cost;
          meta.altar[def.id] = rank + 1;
          flushSave();
          setScreen(altarHtml());
        }
      }
      return;
    }
    if (act === 'startskill' && el) {
      meta.startSkill = el.getAttribute('data-id');
      flushSave();
      setScreen(altarHtml());
      return;
    }
    if (act === 'sys-prev') plan.system -= 1;
    if (act === 'sys-next') plan.system += 1;
    if (act === 'area-prev') plan.area -= 1;
    if (act === 'area-next') plan.area += 1;
    if (act === 'lv-prev') plan.level -= 1;
    if (act === 'lv-next') plan.level += 1;
    if (act.indexOf('sys-') === 0 || act.indexOf('area-') === 0 || act.indexOf('lv-') === 0) {
      clampPlan();
      setScreen(planHtml());
      return;
    }
    if (act === 'fly') { clampPlan(); startStage(plan.system, plan.area, plan.level); return; }
    if (act === 'onward' && pending) { panel = null; startStage(pending.next.system, pending.next.area, pending.next.level); return; }
    if (act === 'replay') {
      panel = null;
      var again = pending ? pending.beaten : run;
      startStage(again.system, again.area, again.level);
      return;
    }
    if (act === 'leave') { flushSave(); showTitle(); return; }
    if (act === 'rise') {
      player.hp = player.maxHp;
      player.iframe = 1;
      shots = shots.filter(function (s) { return s.friendly; });
      panel = null;
      setScreen('');
      if (phase === 'boss' && bossRef) {
        enemies = [];
        beginBoss();
      } else startRound(run.round);
      syncChrome();
      return;
    }
    if (act === 'pick' && el) {
      var idx = parseInt(el.getAttribute('data-idx'), 10);
      if (cards[idx]) applyCard(cards[idx]);
      panel = null;
      setScreen('');
      syncChrome();
      if (player.xp >= xpNeed()) openLevelUp();
      updateHud();
    }
  }

  function canvasPoint(e) {
    var rect = canvas.getBoundingClientRect();
    pointer.x = (e.clientX - rect.left) * (w / rect.width);
    pointer.y = (e.clientY - rect.top) * (h / rect.height);
  }

  function bindJoy() {
    var base = $('joy-base');
    var knob = $('joy-knob');
    function move(e) {
      var r = base.getBoundingClientRect();
      var dx = e.clientX - (r.left + r.width / 2);
      var dy = e.clientY - (r.top + r.height / 2);
      var max = r.width * 0.34;
      var dist = hypot(dx, dy) || 1;
      var c = Math.min(max, dist);
      joy.active = true;
      joy.dx = (dx / dist) * (c / max);
      joy.dy = (dy / dist) * (c / max);
      knob.style.transform = 'translate(' + (dx / dist) * c + 'px,' + (dy / dist) * c + 'px)';
    }
    base.addEventListener('pointerdown', function (e) {
      joy.id = e.pointerId;
      base.setPointerCapture(e.pointerId);
      move(e);
      e.preventDefault();
    });
    base.addEventListener('pointermove', function (e) { if (e.pointerId === joy.id) move(e); });
    function end(e) {
      if (e.pointerId !== joy.id) return;
      joy.id = null;
      joy.active = false;
      joy.dx = 0;
      joy.dy = 0;
      knob.style.transform = 'translate(0,0)';
    }
    base.addEventListener('pointerup', end);
    base.addEventListener('pointercancel', end);
  }

  function bind() {
    $('btn-settings').innerHTML = ICONS.gear;
    $('btn-pause').innerHTML = '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M7 5h3v14H7V5zm7 0h3v14h-3V5z"/></svg>';
    document.body.addEventListener('click', function (e) {
      var b = e.target.closest('[data-act]');
      if (!b || b.disabled) return;
      onAction(b.getAttribute('data-act'), b);
    });
    canvas.addEventListener('pointerdown', function (e) {
      if (e.target.closest && e.target.closest('#joy')) return;
      pointer.down = true;
      pointer.inside = true;
      canvasPoint(e);
    });
    canvas.addEventListener('pointermove', function (e) {
      if (e.target.closest && e.target.closest('#joy')) return;
      pointer.inside = true;
      canvasPoint(e);
    });
    window.addEventListener('pointerup', function () { pointer.down = false; });
    canvas.addEventListener('pointerleave', function () { if (!pointer.down) pointer.inside = false; });
    window.addEventListener('keydown', function (e) {
      keys[e.code] = true;
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].indexOf(e.code) >= 0) e.preventDefault();
      if (e.code === 'Tab') {
        e.preventDefault();
        if (mode === 'play') onAction('stats');
      } else if (e.code === 'Escape') {
        if (panel === 'stats' || panel === 'settings') closePanel();
        else if (mode === 'play') onAction('pause');
      } else if (e.code === 'Enter') {
        if (panel === 'victory') onAction('keep');
        else if (mode === 'title') onAction(fresh ? 'begin' : 'continue');
        else if (panel === 'pause') onAction('resume');
      }
    });
    window.addEventListener('keyup', function (e) { keys[e.code] = false; });
    document.addEventListener('visibilitychange', function () {
      if (document.hidden && mode === 'play' && !panel) openPanel('pause');
      if (document.hidden) AudioBus.suspend();
      if (saveDirty) flushSave();
    });
    window.addEventListener('pagehide', function () { if (saveDirty) flushSave(); });
    window.addEventListener('resize', resize);
    if (window.ResizeObserver) new ResizeObserver(resize).observe(frameEl);
    document.addEventListener('touchmove', function (e) {
      if (e.target.closest && e.target.closest('#joy, #screen, button')) return;
      e.preventDefault();
    }, { passive: false });
    bindJoy();
  }

  function loop(now) {
    try {
      if (!last) last = now;
      var dt = Math.min(0.033, (now - last) / 1000);
      last = now;
      update(dt);
      render();
      requestAnimationFrame(loop);
    } catch (err) {
      showError(err);
    }
  }

  function boot() {
    if (!ctx) { showError(new Error('Canvas is not available')); return; }
    reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    loadState();
    bind();
    resize();
    loadArt();
    showTitle();
    requestAnimationFrame(loop);
  }

  if (location.hash === '#shot') {
    window.__storm = {
      xp: function (n) { grantXp(n); },
      life: function (n) { meta.lifeforce = n; flushSave(); },
      altar: function () { mode = 'title'; panel = null; setScreen(altarHtml()); },
      boss: function () { if (mode !== 'play') startStage(1, 1, 1); survive = nextBoss; },
      swarm: function () {
        var i;
        for (i = 0; i < 18; i++) spawnEnemy(i % 4 === 0 ? 'spitter' : 'wisp', 40 + (i % 9) * (w / 9), 30 + (i % 3) * 40);
      }
    };
  }

  boot();
})();

</script>
</body>
</html>
